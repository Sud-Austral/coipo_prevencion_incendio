name: ETL y despliegue a GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'INSUMO_INCENDIO/**'
      - 'ETL/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # botón manual en la pestaña Actions

# Por omision para todos los jobs. El job `build` los amplia a contents: write
# porque commitea las capas del ETL; los demas siguen en solo lectura.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write para poder commitear frontend/public/data. Declarar el
    # bloque aqui REEMPLAZA el del workflow, asi que hay que repetir los otros
    # dos: configure-pages y upload-pages-artifact corren en este mismo job.
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 1 evita traerse el historial. No se usa sparse-checkout:
          # INSUMO_INCENDIO es ~545 MB de un repo de 545 MB, así que excluir el
          # resto no ahorraría nada y sí añade una forma de que falle.
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ETL/requirements.txt

      - run: pip install -r ETL/requirements.txt

      # tippecanoe es el motivo de correr el ETL aquí y no en Windows: convierte
      # las capas viales (19.000 líneas, 5,7 M de vértices) en teselas
      # vectoriales. Compilarlo toma ~2 min, así que se cachea el binario.
      - name: Caché de tippecanoe
        id: cache-tippecanoe
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/tippecanoe
          key: tippecanoe-2.78.0-${{ runner.os }}

      - name: Compilar tippecanoe
        if: steps.cache-tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch 2.78.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version || true
          

      # Genera las capas Y las valida. Si verify.py falla, el workflow falla y
      # no se publica nada roto.
      - name: ETL
        run: python ETL/run.py -v

      # Los controles negativos: cada mutacion reintroduce un defecto y exige que
      # se ponga roja la asercion que lo vigila. Va DESPUES del ETL a proposito:
      # necesita ETL/_build/*.geojson, el intermedio de tippecanoe, sin el cual
      # D12 y D13 -las dos que cazan un huso UTM invertido- no se pueden
      # verificar. En Windows ese intermedio no existe; aqui si.
      - name: Controles negativos de los datos
        run: python ETL/verify.py --negativas

      # Redundante con el commit de más abajo en el caso feliz, y se conserva a
      # propósito: es el único canal que sobrevive cuando una corrida genera las
      # capas pero falla o se cancela antes de commitearlas.
      # El atajo diario sigue siendo `npm run datos`, que las baja de Pages.
      - name: Publicar las capas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: capas-geo
          path: frontend/public/data
          retention-days: 30
          if-no-files-found: error

      # Las capas se versionan en main. Es el unico productor valido: en Windows
      # no hay tippecanoe y ETL/tiles.py cae en modo degradado (GeoJSON en vez de
      # PMTiles), asi que un commit hecho a mano desde un portatil cambiaria el
      # formato publicado.
      #
      # Va DESPUES del ETL, que ya corrio verify.py y habria hecho fallar el job:
      # no se commitea una capa que no valida.
      #
      # ESTO NO REALIMENTA EL WORKFLOW. GitHub no dispara ejecuciones con pushes
      # firmados por GITHUB_TOKEN, que es el que usa actions/checkout. El
      # [skip ci] del mensaje es el cinturon sobre los tirantes.
      #
      # Tampoco hay carrera con un push humano: `concurrency: group: pages` con
      # cancel-in-progress cancela ESTA corrida en cuanto entra otra, mucho antes
      # de llegar aqui. Si aun asi el push fuera rechazado, el job debe caerse a
      # la vista y no reintentar a ciegas sobre una punta que no conoce.
      - name: Versionar las capas generadas
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "capas sin cambios: no hay nada que commitear"
            exit 0
          fi
          git commit -m "datos: capas del ETL $(date -u +%F) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Resumen
        run: |
          echo "### Capas publicadas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh frontend/dist/data >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # Verificación visual del banner institucional y del panel de indicadores. Va
  # en un job APARTE y en paralelo, no como paso de `build`: no necesita nada
  # del ETL (todas las capas se piden con fetch en runtime, no hay ningún import
  # de GeoJSON y `vite build` funciona sin frontend/public/data), así que no
  # tiene por qué pagar los ~545 MB de INSUMO_INCENDIO ni la compilación de
  # tippecanoe.
  #
  # Por eso mismo aquí verify:panel corre contra datos FICTICIOS: un fixture de
  # 12 incendios con cifras calculadas a mano. En local, donde el visor trabaja
  # con las capas de verdad, afirma las cifras de producción.
  verificar-visual:
    runs-on: ubuntu-latest
    steps:
      # sparse-checkout sí compensa aquí, al revés que en `build`: se salta
      # INSUMO_INCENDIO entero. La exclusión de public/data no es cosmética:
      # desde que las capas se versionan, `sparse-checkout: frontend` a secas se
      # traería los ~35 MB de datos y este job dejaría de bajar menos de 1 MB.
      # Excluir necesita apagar el modo cono, que es el que no admite negaciones.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Patrones anclados con barra inicial y final, que es la forma
          # inequivoca en la semantica tipo .gitignore del modo NO cono: sin la
          # barra, `frontend` casaria cualquier componente con ese nombre.
          sparse-checkout: |
            /frontend/
            !/frontend/public/data/

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # WebSocket global (para CDP) es estable desde 22.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      # ubuntu-24.04 trae Google Chrome preinstalado; no hace falta instalarlo.
      - run: npm run verify:banner
        working-directory: frontend

      # if: always() para que el panel se verifique aunque el banner regrese:
      # son dos superficies independientes y saber que fallaron las dos, o solo
      # una, ahorra una vuelta entera.
      #
      # `--datos ficticios` va EXPLÍCITO y no se deja al descubrimiento
      # automático del script (que mira si existe public/data/manifest.json).
      # Con las capas ya versionadas, un fallo o un cambio en la exclusión del
      # sparse-checkout de arriba las metería en el runner y el script pasaría a
      # afirmar cifras de producción contra un fixture de 12 incendios: rojo sin
      # que nadie hubiera roto nada. El fixture ejercita a propósito una capa
      # servida por teselas y una región con acento agudo, que son dos de los
      # caminos que en producción se rompen en silencio.
      - if: always()
        run: npm run verify:panel -- --datos ficticios
        working-directory: frontend

      # if: always() porque cuando falla es justo cuando hacen falta las capturas.
      - name: Capturas de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-verificacion
          path: frontend/.verificacion
          retention-days: 14

  deploy:
    # El build caro arranca de inmediato, pero no se publica nada si el banner o
    # el panel regresaron.
    needs: [build, verificar-visual]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Prueba de humo contra el sitio YA PUBLICADO, no contra el artefacto. Un
  # artefacto correcto puede servirse mal: el base path, la compresion de Pages y
  # el soporte de Range son propiedades del SERVIDOR, no del build, y ninguna de
  # las tres se ve en una captura local ni en dist/.
  humo:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el sitio publicado
        env:
          # ACOPLADO al `base` de frontend/vite.config.js y al <link rel="preconnect">
          # de frontend/index.html. Los tres se cambian juntos.
          BASE: https://sud-austral.github.io/coipo_prevencion_incendio/
        run: |
          set -euo pipefail

          echo "== index.html y su base path"
          curl -sSfL "$BASE" -o index.html
          if ! grep -q '/coipo_prevencion_incendio/assets/' index.html; then
            echo "FALLA: index.html no referencia /coipo_prevencion_incendio/assets/"
            echo "       el build salio con el base mal resuelto y codigo de salida 0"
            exit 1
          fi
          echo "OK   index.html referencia el subpath correcto"

          echo "== manifest.json"
          curl -sSfL "${BASE}data/manifest.json" -o manifest.json
          python3 -c "import json; json.load(open('manifest.json', encoding='utf-8'))"
          echo "OK   manifest.json parsea"

          # Una linea por capa: nombre archivo bytes formato.
          #
          # El sed que quita el blanco final no sobra. Si el interprete emite
          # finales CRLF, el ultimo campo queda con un retorno de carro pegado,
          # deja de ser igual a "pmtiles", el bucle de Range se salta TODAS las
          # capas y el job pasa en verde sin haber comprobado nada. Comprobado
          # el 2026-09-10 corriendo este mismo guion en Windows.
          python3 -c "import json; m=json.load(open('manifest.json', encoding='utf-8')); [print(n, c['archivo'], c['bytes'], c.get('formato','geojson')) for n, c in m['capas'].items()]" | sed 's/[[:space:]]*$//' > capas.txt
          cat capas.txt

          # Accept-Encoding: identity es OBLIGATORIO. Pages comprime
          # application/octet-stream, y sin esa cabecera se compara el tamano
          # declarado contra el del cuerpo COMPRIMIDO: falso rojo garantizado.
          echo "== tamano servido vs. declarado"
          while read -r nombre archivo bytes formato; do
            servido=$(curl -sSfL -H 'Accept-Encoding: identity' -o /dev/null -w '%{size_download}' "${BASE}data/${archivo}")
            if [ "$servido" != "$bytes" ]; then
              echo "FALLA: $nombre: el manifest declara $bytes B y Pages sirve $servido B"
              exit 1
            fi
            echo "OK   $nombre: $servido B, como declara el manifest"
          done < capas.txt

          # Sin respuestas 206 el visor NO DIBUJA NINGUNA CARRETERA y falla con
          # «Check that your storage backend supports HTTP Byte Serving». Es el
          # unico fallo del visor que no se ve ni en el artefacto ni en una
          # captura local: depende de como sirva el host.
          echo "== HTTP Range sobre las teselas"
          vistas=0
          while read -r nombre archivo bytes formato; do
            [ "$formato" = "pmtiles" ] || continue
            vistas=$((vistas + 1))
            codigo=$(curl -sS -o cabecera.bin -w '%{http_code}' -H 'Range: bytes=0-126' "${BASE}data/${archivo}")
            if [ "$codigo" != "206" ]; then
              echo "FALLA: $nombre: Range devolvio $codigo y no 206; el visor no dibujaria esta capa"
              exit 1
            fi
            if [ "$(head -c 7 cabecera.bin)" != "PMTiles" ]; then
              echo "FALLA: $nombre: el rango 0-126 no empieza por el magic 'PMTiles'"
              exit 1
            fi
            echo "OK   $nombre: 206 y magic PMTiles en los primeros 127 B"
          done < capas.txt

          # Una comprobacion que no comprueba nada es peor que no tenerla: si el
          # bucle de arriba no vio ni una capa de teselas, esto no paso, fallo.
          if [ "$vistas" -eq 0 ]; then
            echo "FALLA: ninguna capa pmtiles entro al bucle de Range"
            exit 1
          fi
          echo "OK   $vistas capas de teselas verificadas con Range"
