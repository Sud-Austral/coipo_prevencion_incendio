pendientes_de_declaracion:
  - "[PENDIENTE] Este manifiesto no enumera uno por uno los cientos de archivos de insumo que registra la evidencia. Cubre los que consume el proceso y los ejemplos representativos de cada familia; completar el resto requiere una corrida del script de sellado sobre el arbol de insumos."
  - "[VERIFICAR] Contenido de [INSUMO_INCENDIO/BBDD INVESTIGACIÓN UAD CONSOLIDADA COMPLETA.xlsx]. Es la revision mas urgente: el repositorio figura como publico en los metadatos de la evidencia."
  - "[VERIFICAR] Las actas de reunion versionadas junto al material regional. Suelen consignar asistentes y nadie declaro que corresponda publicarlas."
  - "[PENDIENTE] Quien entrego cada capa regional y con que autorizacion para publicarla. Ningun archivo del repositorio lo consigna y el autor del commit no sirve como respuesta."
  - "[PENDIENTE] Que capa alimenta exactamente cada proceso. La configuracion de rutas [ETL/cfg.py] no aparece resuelta en la evidencia, de modo que la correspondencia entre insumo y salida esta inferida por ubicacion y por nombre, no leida."
